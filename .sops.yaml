creation_rules:
  # Secrets of user `cheng`
  - path_regex: secrets/personal/cheng/[^/]+\.(yaml|json|ini|env)$
    key_groups:
      - age:
          - *nixos_operator__cheng

  # Global NixOS host secrets
  - path_regex: secrets/nixos/[^/]+\.(yaml|json|ini|env)$
    key_groups:
      - age:
          - *nixos_operator__cheng
          - *nixos_host__taco

  # Secrets of host `mochi`
  - path_regex: secrets/nixos/mochi/[^/]+\.(yaml|json|ini|env)$
    key_groups:
      - age:
          - *nixos_operator__cheng
          - *nixos_host__mochi

  # Secrets of host `taco`
  - path_regex: secrets/nixos/taco/[^/]+\.(yaml|json|ini|env)$
    key_groups:
      - age:
          - *nixos_operator__cheng
          - *nixos_host__taco

  # Secrets of host `vps-rainyun-gofer`
  - path_regex: secrets/nixos/vps-rainyun-gofer/[^/]+\.(yaml|json|ini|env)$
    key_groups:
      - age:
